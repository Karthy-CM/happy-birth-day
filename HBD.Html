
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Susana</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:black;
color:white;
}

/* Cinematic Background */
.bg{
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.9)),
url("https://images.unsplash.com/photo-1519681393784-d120267933ba");
background-size:cover;
background-position:center;
animation:zoom 20s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* Center Card */
.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
padding:20px;
width:90%;
max-width:420px;
animation:fade 2s ease;
}

h1{
font-size:32px;
letter-spacing:2px;
}

.subtitle{
margin-top:10px;
font-size:18px;
opacity:0.8;
}

button{
margin-top:25px;
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#ff9800,#ff4081);
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

.message{
margin-top:25px;
font-size:20px;
display:none;
animation:fade 2s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

/* Mobile Optimization */
@media(max-width:480px){
h1{font-size:26px;}
.subtitle{font-size:16px;}
.message{font-size:18px;}
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<h1>🎂 Happy Birthday Susana 🎂</h1>
<p class="subtitle">A Special Cinematic Surprise Just For You ✨</p>

<button onclick="openMessage()">Open Your Message</button>

<div class="message" id="msg">
🌟 May your day be filled with smiles, laughter  
and unforgettable moments.<br><br>
Keep shining and keep smiling always ✨<br><br>
🎉 Have an Amazing Birthday Susana 🎉
</div>

</div>

<script>
function openMessage(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
